<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Smart Campus - Lecturer</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f9;
        margin: 40px;
    }

    .container {
        max-width: 800px;
        margin: auto;
    }

    .head {
        text-align: center;
    }

    .card {
        background: white;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        margin-top: 25px;
    }

    label {
        display: block;
        margin: 10px 0 5px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 9px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    button {
        background-color: #007bff;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 15px;
    }

    button:hover {
        background-color: #0056b3;
    }

    .logout {
        background-color: #dc3545;
    }

    .section {
        margin-bottom: 30px;
    }
</style>
```

</head>

<body>

<div class="container">

```
<div class="head">
    <h1>Smart Campus Portal</h1>
    <h2>Lecturer Dashboard</h2>
    <p>Manage attendance and examination marks.</p>
</div>


<!-- Attendance -->

<div class="card section">

    <h3>Record Lecture Attendance</h3>

    <form action="recordAttendance" method="POST">

        <label>Student ID:</label>
        <input type="number" name="studentId" required>

        <label>Course ID:</label>
        <input type="number" name="courseId" required>

        <label>Date:</label>
        <input type="date" name="date" required>

        <label>Attendance Status:</label>

        <select name="status" style="width:100%; padding:9px;">
            <option value="Present">Present</option>
            <option value="Absent">Absent</option>
        </select>

        <button type="submit">
            Submit Attendance
        </button>

    </form>

</div>


<!-- Examination Marks -->

<div class="card">

    <h3>Enter Academic Examination Grades</h3>

    <form action="processAndSaveExamMarks" method="POST">

        <label>Student ID:</label>
        <input type="number" name="studentId" required>

        <label>Course ID:</label>
        <input type="number" name="courseId" required>

        <label>Coursework Score:</label>
        <input type="number"
               step="0.01"
               name="coursework"
               required>

        <label>Examination Score:</label>
        <input type="number"
               step="0.01"
               name="exam"
               required>

        <button type="submit">
            Calculate & Save Marks
        </button>

    </form>

</div>


<div style="text-align:center;">
    <button class="logout" onclick="logout()">
        Logout
    </button>
</div>
```

</div>

<script>
    function logout() {
        window.location.href = "login.html";
    }
</script>

</body>
</html>
