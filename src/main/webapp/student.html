</head>

<body>

<div class="container">

```
<div class="head">
    <h1>Smart Campus Portal</h1>
    <h2>Student Academic Portal</h2>

    <p>
        Course registration and academic information.
    </p>
</div>


<!-- Course Registration -->

<div class="card">

    <h3>Course Registration</h3>

    <form action="registerCourse" method="POST">

        <label>Your Registered Student ID:</label>

        <input
            type="number"
            name="studentId"
            required
        >

        <label>Target Course Elective ID:</label>

        <input
            type="number"
            name="courseId"
            required
        >

        <label>Semester Term:</label>

        <select name="semester">

            <option value="Semester 1 2026">
                Semester 1 2026
            </option>

            <option value="Semester 2 2026">
                Semester 2 2026
            </option>

        </select>

        <button type="submit">
            Confirm Course Registration
        </button>

    </form>

</div>


<!-- Logout -->

<div style="text-align:center;">

    <button class="logout" type="button" onclick="logout()"
    >
        Logout
    </button>

</div>

</div>

<script>

    function logout() {
        window.location.href = "login.html";
    }
    const role = sessionStorage.getItem("role");

    if (role !== "Student") {
        window.location.href = "login.html";
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = "login.html";
    }

</script>
