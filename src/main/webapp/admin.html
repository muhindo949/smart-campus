<title>Smart Campus - Administrator</title>

<style>
    body {
        font-family: Arial, sans-serif;

        display: block;

    }

    button {
        background-color: #007bff;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;

    }

    button:hover {

        background-color: #dc3545;

```

</head>

<body>

<div class="container">

```
<div class="head">
    <h1>Smart Campus Portal</h1>
    <h2>Administrator Control Panel</h2>
    <p>Manage student infrastructure records.</p>
</div>

<div class="card">

    <h3>Register New Student</h3>

    <form action="adminManageStudent" method="POST">

        <label>Student Number:</label>
        <input type="text" name="studentNo" required>

        <label>Name:</label>
        <input type="text" name="name" required>

        <label>Academic Programme:</label>
        <input type="text" name="programme" required>

        <label>Phone Contact:</label>
        <input type="text" name="phone" required>

        <button type="submit">
            Register New Student Record
        </button>

    </form>

</div>

<div style="text-align:center;">
    <button type = "button" class="logout" onclick="logout()">
        Logout
    </button>
</div>
```

</div>

<script>
    function logout() {
        window.location.href = "login.html";
    }
<script>
    const role = sessionStorage.getItem("role");

    if (role !== "Administrator") {
        window.location.href = "login.html";
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = "login.html";
    }
</script>
</script>

</body>
